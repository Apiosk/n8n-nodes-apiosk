<!--
  viewBox is cropped to the artwork's own bounds (x 151-872.5, y 110-906) plus an
  8-unit margin, squared and re-centred, instead of the 1024 grid the mark was
  drawn on. n8n scales an icon to fit a fixed square box, so every unit of empty
  padding inside the viewBox is a unit the mark does not get: on the old grid the
  glyph reached 78% of the box and read small next to the built-in node icons.
  Keep the box tight if the geometry below ever changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="105.75 102 812 812" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Apiosk logo</title>
  <desc id="desc">A central node connected to six outer nodes.</desc>
  <defs>
    <linearGradient id="apiosk-violet" x1="158" y1="120" x2="866" y2="906" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="52%" stop-color="#6b38d4" />
      <stop offset="100%" stop-color="#5516be" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#apiosk-violet)" stroke-width="43" stroke-linecap="butt">
    <line x1="511.5" y1="190.5" x2="511.5" y2="511.5" />
    <line x1="231" y1="335" x2="511.5" y2="511.5" />
    <line x1="792.5" y1="335" x2="511.5" y2="511.5" />
    <line x1="231" y1="675" x2="511.5" y2="511.5" />
    <line x1="792.5" y1="675" x2="511.5" y2="511.5" />
    <line x1="511.5" y1="825.5" x2="511.5" y2="511.5" />
  </g>
  <g fill="url(#apiosk-violet)">
    <circle cx="511.5" cy="190.5" r="80.5" />
    <circle cx="231" cy="335" r="80" />
    <circle cx="792.5" cy="335" r="80" />
    <circle cx="511.5" cy="511.5" r="135" />
    <circle cx="231" cy="675" r="80" />
    <circle cx="792.5" cy="675" r="80" />
    <circle cx="511.5" cy="825.5" r="80.5" />
  </g>
</svg>
