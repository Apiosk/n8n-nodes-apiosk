<!--
  Traced from the Apiosk brand mark: a hub with four diagonal spokes, plus a
  detached node above and below. The top and bottom nodes carry NO connector —
  that gap is part of the mark, do not "fix" it by joining all six spokes.
  Fill is the flat brand violet #6531EA; the mark has no gradient.

  viewBox is cropped to the artwork's own bounds (x 188.5-835.5, y 153-871) plus
  an 8-unit margin, squared and re-centred, instead of the 1024 grid the mark was
  drawn on. n8n scales an icon to fit a fixed square box, so every unit of empty
  padding inside the viewBox is a unit the mark does not get. Keep the box tight
  if the geometry below ever changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="145 145 734 734" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
  <title id="title">Apiosk logo</title>
  <desc id="desc">A central node linked to four outer nodes, with a free-standing node above and below.</desc>
  <g fill="none" stroke="#6531EA" stroke-width="43.5" stroke-linecap="butt">
    <line x1="268" y1="352" x2="512" y2="512" />
    <line x1="756" y1="352" x2="512" y2="512" />
    <line x1="268" y1="672" x2="512" y2="512" />
    <line x1="756" y1="672" x2="512" y2="512" />
  </g>
  <g fill="#6531EA">
    <circle cx="512" cy="232.5" r="79.5" />
    <circle cx="268" cy="352" r="79.5" />
    <circle cx="756" cy="352" r="79.5" />
    <circle cx="512" cy="512" r="135" />
    <circle cx="268" cy="672" r="79.5" />
    <circle cx="756" cy="672" r="79.5" />
    <circle cx="512" cy="791.5" r="79.5" />
  </g>
</svg>
