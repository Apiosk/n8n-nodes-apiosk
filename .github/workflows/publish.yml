# Publishes this n8n community node package to npm on every version tag push.
#
# Since May 1 2026, n8n requires community nodes to be published via GitHub
# Actions with npm provenance. Provenance lets anyone cryptographically verify
# that a package was built by this exact workflow, from this exact repository
# and commit. A package published locally with `npm publish` has no provenance
# and cannot be submitted for verification through the n8n Creator Portal.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. On npmjs.com, open this package's settings.
#   2. "Publish access" → "Trusted Publishers" → "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: Apiosk
#        Repository name:  n8n-nodes-apiosk
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead,
#      so no long-lived credential ever lives in the repo settings.
#
#   Note: npm requires the package to already exist before a trusted publisher
#   can be attached. For the very first release only, use Option B (or publish
#   0.1.0 once locally), then switch to Option A.
#
# Option B — npm granular access token (fallback):
#   1. npmjs.com → Access Tokens → Generate New Token → Granular Access Token,
#      scoped to this package with "Read and write" permission.
#   2. GitHub → Settings → Secrets and variables → Actions → New secret,
#      named NPM_TOKEN.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
#   npm run release
#
# Runs interactively: bumps the version, updates the changelog, commits, tags,
# and pushes. The tag push is what triggers this workflow to publish.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for the npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      # OIDC Trusted Publishing needs npm >= 11.5.1. The npm bundled with the
      # current LTS is not guaranteed to be that new, and when it is too old
      # npm falls back to token auth and fails with a confusing 403 rather than
      # saying OIDC is unavailable. Pin the floor explicitly.
      - name: Ensure npm supports OIDC publishing
        run: |
          npm install -g npm@latest
          npm --version

      # --ignore-scripts skips building isolated-vm, a native module pulled in
      # by the n8n-workflow devDependency. It is types-only here and nothing
      # executes it, so compiling it would only add a toolchain dependency and
      # minutes of CI time. See the Development section of the README.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Release
        # Publishes with a provenance attestation (requires id-token: write).
        # `n8n-node release` detects GITHUB_ACTIONS and switches from the
        # interactive local flow to lint + build + publish --provenance.
        #
        # NODE_AUTH_TOKEN is the canonical hand-off: the `registry-url` input on
        # actions/setup-node above writes an .npmrc containing
        # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and points
        # NPM_CONFIG_USERCONFIG at it, so npm reads the token from this env var.
        # Don't `npm config set` the token instead — that writes to the same
        # file setup-node manages and makes it ambiguous which credential is
        # actually sent.
        #
        # Option A (OIDC): leave the NPM_TOKEN secret unset — the token line
        #   resolves empty and npm performs the OIDC exchange instead.
        # Option B (token): set NPM_TOKEN in repo secrets. It must be a
        #   granular access token with *Read and write* on **All packages**
        #   (a token scoped to selected packages cannot cover a package that
        #   does not exist yet) and *Bypass 2FA* enabled.
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
